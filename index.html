<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRA Opening Virtual Exhibit</title>
    <!-- Import the Google Model Viewer script -->
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js"></script></script>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
        }
        model-viewer {
            width: 80%;
            height: 80vh;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <!-- Render the 3D model -->
    <!-- REPLACE "____.glb" WITH YOUR ACTUAL MODEL FILENAME -->
    <model-viewer 
        src="Personalized crotalus.glb" 
        ar 
        ar-modes="webxr scene-viewer quick-look" 
        camera-controls 
        poster="poster.webp" 
        shadow-intensity="1" 
        environment-image="neutral" 
        auto-rotate>
        <button slot="ar-button" style="background-color: white; border-radius: 4px; border: none; position: absolute; top: 16px; right: 16px; ">
      👋 Activate AR
  </button>
</model-viewer>
    
<model-viewer 
        src="travel desk oriented    .glb" 
        ar 
        ar-modes="webxr scene-viewer quick-look" 
        camera-controls 
        poster="poster.webp" 
        shadow-intensity="1" 
        environment-image="neutral"
        exposure="1.7"
        auto-rotate>
        <button class="Hotspot" slot="hotspot-1" data-position="-29.457600312000878m 1.4889665801839391m 0.6770040814480183m" data-normal="-0.14662389450441382m -0.9869193754966695m 0.06701924969456619m" data-visibility-attribute="visible">
            <div class="HotspotAnnotation">This label, written in French, reads: “Precious relic of our Mother Marie, a little bench that she took on trips which would also be a desk for writing to her daughters.”</div>
        </button>
        <button slot="ar-button" style="background-color: white; border-radius: 4px; border: none; position: absolute; top: 16px; right: 16px; ">
      👋 Activate AR
      </button
</model-viewer>

</body>
</html>
